name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium

      - name: Start the system under test
        run: docker compose -f sut/docker-compose.yml up -d

      # compose up returning does not mean Vikunja is serving: it means the
      # containers were created. Poll the API instead, and dump state if it
      # never answers, so a red run says why rather than just timing out.
      - name: Wait for the SUT to answer
        run: |
          for i in $(seq 45); do
            if curl -sf http://localhost:3456/api/v1/info > /dev/null; then
              echo "READY after $((i * 2))s"
              curl -s http://localhost:3456/api/v1/info | head -c 120
              exit 0
            fi
            sleep 2
          done
          echo "::error::SUT did not answer within 90s"
          docker compose -f sut/docker-compose.yml ps -a
          docker compose -f sut/docker-compose.yml logs
          exit 1

      - run: npm test

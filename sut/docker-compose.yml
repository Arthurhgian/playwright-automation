services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456/
      VIKUNJA_FILES_BASEPATH: /tmp/vikunja-files
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_PASSWORD: local-throwaway
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET:-local-dev-insecure-not-a-real-secret}
    ports:
      - 3456:3456
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: local-throwaway
      POSTGRES_USER: vikunja
    volumes:
      - vikunja-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s

volumes:
  vikunja-db:
